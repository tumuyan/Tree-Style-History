<!DOCTYPE html>
<html>

<head>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type">
<title>Linear Bookmark | Tree Style History</title>
<link rel="stylesheet" href="css/history.css">
<script src="scripts/storage-adapter.js"></script>
<script src="scripts/db-manager.js"></script>
<script type="module" src="scripts/bookmark.js"></script>


</head>

<body>
<div id="navigation-menu">
  <h1 class="lang" data-lang-string="treeOptions"></h1>
  <ul>
    <li><a href="history2.html" class="lang" data-lang-string="treeOptions"></a></li>
    <li><a href="history.html" class="lang" data-lang-string="linerHistory"></a></li>
    <li><a href="closed.html" class="lang" data-lang-string="closeHistory"></a></li>
    <li><a href="bookmark.html" class="lang selected" data-lang-string="linerBookMark"></a></li>
    <li><a href="options.html" class="lang" data-lang-string="options"></a></li>
  </ul>
</div>

<div id="history-container">
  <table id="main-table">
      <tr>
      <td><h1 class="lang" data-lang-string="linerBookMark"></h1></td>
          <td id="search">
            <div id="rh-search-form">
              <div id="bookmark-actions">
                <input id="delete-bookmark-button" class="button" type="button" value="" style="display:none;">
                <input id="edit-bookmark-button" class="button" type="button" value="" style="display:none;">
              </div>
              <input id="rh-search" type="text" value="" data-lang-placeholder="searchPlaceholder" data-lang-aria-label="searchLabel">
            </div>
          </td>
      </tr>
      <tr>
          <td colspan="2">
        <div id="rh-bar">
          <label id="rh-bar-uione">
              <input id="master-check-all" type="checkbox" name="checkall" value="false" data-lang-aria-label="selectAll">
          </label>
          <a id="rh-bar-group" href="#" role="button" data-state="yes"></a>
          <a id="rh-bar-orderby" href="#" role="button" data-state="date"></a>
          <a id="rh-bar-order" href="#" role="button" data-state="desc"></a>
          &nbsp;
        </div>
        <div id="rh-views">
          <div id="rh-views-tube">
            <div id="rh-views-insert"></div>
            <div id="rh-views-search-insert"></div>
          </div>
        </div>
          </td>
      </tr>
  </table>
</div>
<div id="alert-holder">
  <img id="alert-holder-loading" alt="Loading" src="images/loading.gif">
</div>
</body>

</html>
