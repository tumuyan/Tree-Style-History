<!DOCTYPE html>
<html>

<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>Popup | Recent History</title>
    <link rel="stylesheet" href="css/popup.css">
    <script src="scripts/storage-adapter.js"></script>
    <!-- No message-adapter.js here: every popup list comes from chrome.history /
         chrome.sessions / chrome.bookmarks, plus the tab list the worker mirrors
         into chrome.storage.session. Loading a channel to the worker would wake
         it into re-running its startup crawl.
         And no db-manager.js: nothing in the popup reads IndexedDB — the tree
         pages (history2/closed) are the ones that go through dbManager. -->
    <script type="module" src="scripts/popup.js"></script>
</head>

<body>
    <div id="popup">
        <div id="popup-header">
            <form id="popup-search" action="#" method="get">


                <div id="popup-footer-left">
                    <a href="options.html" target="_blank"><img class="non-retina"
                            src="images/rh-popup-options.png"><img class="retina"
                            src="images/rh-popup-options-@2x.png"></a>
                </div>

                <input id="popup-search-input" type="text" name="q" value="">

                <a id="popup-search-clear" href="#">&times;</a>

                <a id="popup-open-tree" href="history2.html" target="_blank" title="Open Tree Style History">
                    <img class="non-retina" src="images/tree-32.png">
                </a>

                </div>

                <div style="clear:both;"></div>
            </form>


        </div>
        <div id="popup-insert">
            <!-- Painted by the HTML itself, before storage-adapter.js, the ES
                 module graph or chrome.storage.local.get(null) have run. Every
                 row is built inside onStorageReady(), so without this the popup
                 is an empty box for the whole cold start — indistinguishable
                 from a frozen extension. popup.js removes it once the cache is
                 ready and the block titles take over. -->
            <div id="popup-loading" class="popup-loading" role="status" aria-live="polite">
                <span class="popup-loading-spinner" aria-hidden="true"></span>
                <span class="lang" data-lang-string="loading"></span>
            </div>
        </div>
        <div id="popup-search-insert"></div>
